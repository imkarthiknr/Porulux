name: Deploy API (Cloud Run)

on:
  push:
    branches: [main]
    paths:
      - 'apps/api/**'
      - '.github/workflows/deploy-api.yml'
  workflow_dispatch:

concurrency:
  group: deploy-api
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: apps/api/requirements*.txt

      # Never ship an API that fails its own tests. Tests use fakes, so dummy Supabase values are enough.
      - name: Test
        working-directory: apps/api
        env:
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: test
        run: |
          pip install -r requirements.txt -r requirements-dev.txt
          pytest -q

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      # Builds apps/api/Dockerfile with Cloud Build and updates the existing service. Only the image
      # changes: env vars, Secret Manager mounts, scaling and access settings already on the service are kept.
      - uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: porulux-api
          region: asia-south1
          project_id: ${{ vars.FIREBASE_PROJECT_ID }}
          source: apps/api
